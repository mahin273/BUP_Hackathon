services:
  - type: web
    name: gridwise-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TIMEOUT_SECONDS
        value: "5.0"
